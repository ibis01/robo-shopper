# OKX AI Genesis / X Layer — Finance Copilot submission manifest
name: Robo-Shopper Finance Copilot
slug: robo-shopper-finance-copilot
version: 1.0.0
category: finance_copilot
tagline: A governed, memory-aware trading copilot on X Layer that enforces a 2% risk rulebook and only acts through human-approved Onchain OS commands.

description: |
  Robo-Shopper is an institutional-grade Finance Copilot ASP built for the
  X Layer ecosystem. It helps traders analyze spot + derivatives context,
  manage decisions through an explicit risk rulebook, automate the full
  propose-review-execute workflow, and act with persistent memory of past
  trades and human feedback.

  Unlike autonomous bots, Robo-Shopper never executes without a human
  "Big Green Button" approval. Every trade is logged to a local SQLite
  ledger with win/loss, hold time, and the human's reasoning — so the
  agent learns from its own history.

author:
  name: ibismuh
  handle: "@ibismuh"
  email: ibis01abc@gmail.com

chains:
  - xlayer_test        # primary (Onchain OS dry-run target)
  - xlayer             # mainnet-ready (swap command flips chain flag)

data_sources:
  - name: Binance public spot API
    via: ccxt
    auth: none
  - name: OKX public spot + perpetual API
    via: ccxt
    auth: none
    provides: [price, order_book, funding_rate, open_interest]

capabilities:
  - market_analysis          # RSI, SMA, support/resistance, confidence
  - derivatives_context      # funding rate, OI, mark/index, crowding bias
  - risk_governance          # 2% max-risk, overbought gate, position sizing
  - persistent_memory        # SQLite ledger, win/loss, human feedback
  - proactive_monitoring     # background Voice, 60s scan, terminal alerts
  - onchain_execution        # Onchain OS CLI formatting (dry-run + HITL)
  - decision_dossier         # one-call governed workspace snapshot

tools:
  - get_spot_quote
  - get_order_book_metrics
  - analyze_technicals
  - get_derivatives_context
  - get_portfolio_balance
  - calculate_position_size
  - evaluate_trade_risk
  - propose_trade
  - record_execution
  - close_trade
  - get_trade_history
  - format_onchainos_command
  - generate_governance_dossier

runtime:
  language: python
  version: ">=3.10"
  transport: stdio
  entrypoint: main_server.py
  package_manager: pip
  requirements_file: requirements.txt

env:
  - name: ROBO_MARKET_EXCHANGE
    default: binance
    description: Preferred public exchange (binance or okx); auto-fallback enabled.
  - name: ROBO_VOICE
    default: "on"
    description: Set to "off" when a standalone monitor_service.py is running.
  - name: DASHSCOPE_API_KEY
    required_for: qwen_agent.py
    description: Qwen API key for the optional LLM orchestrator.

safety:
  execution_model: human_in_the_loop
  notes: |
    No private keys are ever held by the agent. On-chain actions are emitted
    as Onchain OS CLI commands for the human to review and run manually.
    All proposals are persisted before execution; PnL and hold-time are
    recorded on close for auditability.

demo:
  prompt: "The Voice flagged ETH oversold at support. Run the full governance check for a 0.5 ETH buy at 1894 with a 1860 stop."
  expected_tool_chain:
    - analyze_technicals
    - get_derivatives_context
    - get_trade_history
    - evaluate_trade_risk
    - calculate_position_size
    - propose_trade
    - format_onchainos_command
    - generate_governance_dossier

links:
  repo: https://github.com/Ibis01/robo-shopper
  demo_video: https://youtu.be/my_DEMO
  docs: ./README.md
