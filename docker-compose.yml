services:
  mcp:
    build: .
    command: supergateway --stdio "python main_server.py" --port 8001
    ports: ["8001:8001"]
  paywall:
    build: .
    command: uvicorn x402_paywall:app --host 0.0.0.0 --port 8002
    ports: ["8002:8002"]
  dashboard:
    build: .
    command: uvicorn dashboard:app --host 0.0.0.0 --port 8003
    ports: ["8003:8003"]
